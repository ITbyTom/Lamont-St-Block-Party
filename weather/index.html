<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script data-goatcounter="https://lamontstblockparty.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    
    <title>Lamont St. Weather Update</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #2d63c8;
            --text-dark: #222222;
            --bg-light: #fcfcfc;
            --alert-red: #d63031;
        }

        body {
            margin: 0;
            font-family: 'Open Sans', sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
            background-color: var(--bg-light);
            overflow-x: hidden;
        }

        /* --- WEATHER ALERT BANNER --- */
        .weather-alert {
            background-color: var(--alert-red);
            color: #fff;
            text-align: center;
            padding: 15px 20px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            position: relative;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            letter-spacing: 0.5px;
        }

        /* --- PARALLAX HEADER --- */
        .header-wrapper {
            position: relative;
            height: 350px; /* Slightly shorter for a sub-page */
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #eee;
        }

        .header-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 130%; 
            background: url('../LamontStHeader.png') no-repeat center center;
            background-size: cover;
            z-index: 1;
            will-change: transform;
        }

        .header-logo {
            position: relative;
            z-index: 2;
            max-width: 80%;
            height: 200px; 
            width: 500px;
            background: url('../LamontStLogo.png') no-repeat center center;
            background-size: contain;
            will-change: transform;
        }

        /* --- MAIN CONTENT --- */
        .container {
            max-width: 800px;
            margin: -40px auto 60px;
            padding: 40px;
            background: white;
            position: relative;
            z-index: 3;
            box-shadow: 0 15px 50px rgba(0,0,0,0.08);
            border-radius: 12px;
        }

        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: bold;
        }
        .btn-back:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .header-wrapper { height: 250px; }
            .container { margin: 0 auto; border-radius: 0; padding: 25px; }
        }
    </style>
</head>
<body>

<div class="weather-alert">
    ⛈️ THURSDAY RAIN DATE UPDATE ⛈️
</div>

<div class="header-wrapper">
    <div class="header-bg" id="headerBg"></div>
    <div class="header-logo" id="headerLogo"></div>
</div>

<div class="container">
    <a href="../index.html" class="btn-back">← Back to Main Page</a>
    
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSccn2z5d5su2mVn5a0oXazX5u6IqyRKiFvZ5TuHe_j7ChkOdQ/viewform?embedded=true" width="100%" height="1500px" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>

</div>

<script>
    // Just the simple parallax effect for this page
    window.addEventListener('scroll', () => {
        let v = window.scrollY;
        document.getElementById('headerBg').style.transform = `translateY(${v * 0.4}px)`;
        document.getElementById('headerLogo').style.transform = `translateY(${v * 0.15}px)`;
    });
</script>

</body>
</html>
